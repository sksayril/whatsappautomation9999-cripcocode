<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the rounded square -->
    <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner glow for the white area -->
    <radialGradient id="whiteGlow" cx="75%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e5f9f0" stop-opacity="0.6" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#10b981" rx="0"/>
  
  <!-- Rounded square with shadow -->
  <rect x="106" y="106" width="300" height="300" rx="60" fill="url(#squareGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle border on rounded square -->
  <rect x="106" y="106" width="300" height="300" rx="60" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3"/>
  
  <!-- Circular cutout/depression -->
  <circle cx="256" cy="256" r="100" fill="none"/>
  
  <!-- Left half - green concave area -->
  <path d="M 256 156 A 100 100 0 0 1 256 356 L 256 256 Z" fill="#059669" opacity="0.7"/>
  
  <!-- Right half - white curved area with glow -->
  <path d="M 256 156 A 100 100 0 0 0 256 356 L 256 256 Z" fill="url(#whiteGlow)"/>
  
  <!-- Glow at intersection -->
  <circle cx="256" cy="256" r="50" fill="url(#glowGrad)" opacity="0.6"/>
  
  <!-- Highlight on white area -->
  <ellipse cx="300" cy="256" rx="40" ry="60" fill="#ffffff" opacity="0.9"/>
</svg>
