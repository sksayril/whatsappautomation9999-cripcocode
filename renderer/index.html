<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wapiea - WhatsApp Marketing Automation</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="root">
        <div style="
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #ffffff 100%);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            padding: 40px;
        ">
            <div style="
                text-align: center;
                color: white;
                max-width: 500px;
            ">
                <!-- Animated Logo/Icon -->
                <div style="
                    width: 100px;
                    height: 100px;
                    margin: 0 auto 30px;
                    background: rgba(255, 255, 255, 0.2);
                    backdrop-filter: blur(10px);
                    border-radius: 25px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                    animation: pulse 2s ease-in-out infinite;
                ">
                    <svg viewBox="0 0 100 100" style="width: 60px; height: 60px;" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#10b981" stop-opacity="1" />
                                <stop offset="100%" stop-color="#059669" stop-opacity="1" />
                            </linearGradient>
                            <radialGradient id="glowGradMain" cx="50%" cy="50%">
                                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
                                <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
                                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                            </radialGradient>
                            <radialGradient id="whiteGlowMain" cx="75%" cy="50%">
                                <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                                <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9" />
                                <stop offset="100%" stop-color="#e5f9f0" stop-opacity="0.6" />
                            </radialGradient>
                            <filter id="shadowMain" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                                <feOffset dx="0" dy="2" result="offsetblur"/>
                                <feComponentTransfer>
                                    <feFuncA type="linear" slope="0.3"/>
                                </feComponentTransfer>
                                <feMerge>
                                    <feMergeNode/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <!-- Rounded square -->
                        <rect x="20" y="20" width="60" height="60" rx="12" fill="url(#logoGradientMain)" filter="url(#shadowMain)"/>
                        <rect x="20" y="20" width="60" height="60" rx="12" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.3"/>
                        <!-- Circular cutout -->
                        <circle cx="50" cy="50" r="20" fill="none"/>
                        <!-- Left half - green -->
                        <path d="M 50 30 A 20 20 0 0 1 50 70 L 50 50 Z" fill="#059669" opacity="0.7"/>
                        <!-- Right half - white -->
                        <path d="M 50 30 A 20 20 0 0 0 50 70 L 50 50 Z" fill="url(#whiteGlowMain)"/>
                        <!-- Glow at intersection -->
                        <circle cx="50" cy="50" r="10" fill="url(#glowGradMain)" opacity="0.6"/>
                        <!-- Highlight -->
                        <ellipse cx="60" cy="50" rx="8" ry="12" fill="#ffffff" opacity="0.9"/>
                    </svg>
                </div>

                <!-- App Name -->
                <h1 style="
                    font-size: 42px;
                    font-weight: 800;
                    margin: 0 0 10px 0;
                    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                    background: linear-gradient(45deg, #ffffff, #f0f0f0);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                    animation: fadeInDown 0.8s ease-out;
                ">Wapiea</h1>

                <!-- Loading Text -->
                <p style="
                    font-size: 18px;
                    margin: 0 0 40px 0;
                    opacity: 0.9;
                    font-weight: 300;
                    letter-spacing: 1px;
                    animation: fadeInUp 0.8s ease-out 0.2s both;
                ">Loading WhatsApp Marketing Automation...</p>

                <!-- Animated Loading Bar -->
                <div style="
                    width: 100%;
                    max-width: 300px;
                    margin: 0 auto 20px;
                    height: 6px;
                    background: rgba(255, 255, 255, 0.2);
                    border-radius: 10px;
                    overflow: hidden;
                    animation: fadeInUp 0.8s ease-out 0.4s both;
                ">
                    <div style="
                        height: 100%;
                        width: 0%;
                        background: linear-gradient(90deg, #ffffff, #f0f0f0);
                        border-radius: 10px;
                        animation: loading 2s ease-in-out infinite;
                        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
                    "></div>
                </div>

                <!-- Loading Dots -->
                <div style="
                    display: flex;
                    justify-content: center;
                    gap: 8px;
                    margin-top: 20px;
                    animation: fadeInUp 0.8s ease-out 0.6s both;
                ">
                    <div style="
                        width: 12px;
                        height: 12px;
                        background: white;
                        border-radius: 50%;
                        animation: bounce 1.4s ease-in-out infinite;
                        animation-delay: 0s;
                    "></div>
                    <div style="
                        width: 12px;
                        height: 12px;
                        background: white;
                        border-radius: 50%;
                        animation: bounce 1.4s ease-in-out infinite;
                        animation-delay: 0.2s;
                    "></div>
                    <div style="
                        width: 12px;
                        height: 12px;
                        background: white;
                        border-radius: 50%;
                        animation: bounce 1.4s ease-in-out infinite;
                        animation-delay: 0.4s;
                    "></div>
                </div>

                <!-- Status Text -->
                <p style="
                    font-size: 14px;
                    margin-top: 30px;
                    opacity: 0.7;
                    font-weight: 500;
                    letter-spacing: 0.5px;
                    animation: fadeInUp 0.8s ease-out 0.8s both;
                ">Please wait while we prepare everything...</p>
            </div>
        </div>
    </div>

    <style>
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>

    <!-- External Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Component Loader -->
    <script src="js/loader.js"></script>
</body>
</html>
