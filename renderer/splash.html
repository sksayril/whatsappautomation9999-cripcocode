<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wapiea - WhatsApp Marketing Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #ffffff 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .splash-container {
            text-align: center;
            color: white;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-icon {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
            animation: pulse 2s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .logo-icon svg {
            width: 70px;
            height: 70px;
        }

        .app-name {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ffffff, #f0f0f0, #ffffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease-out 0.3s both, shimmer 3s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 18px;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .loading-container {
            margin-top: 60px;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .loading-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 0 auto 20px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffffff, #10b981, #ffffff);
            background-size: 200% 100%;
            border-radius: 10px;
            width: 0%;
            animation: loading 2s ease-in-out infinite, shimmer 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .loading-text {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .powered-by {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            opacity: 0.8;
            animation: fadeIn 1s ease-out 1.2s both;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .powered-by strong {
            font-weight: 700;
            opacity: 1;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
                left: 0;
            }
            50% {
                width: 70%;
                left: 0;
            }
            100% {
                width: 100%;
                left: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="splashLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#10b981" stop-opacity="1" />
                            <stop offset="100%" stop-color="#059669" stop-opacity="1" />
                        </linearGradient>
                        <radialGradient id="splashGlowGrad" cx="50%" cy="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
                            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </radialGradient>
                        <radialGradient id="splashWhiteGlow" cx="75%" cy="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                            <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="100%" stop-color="#e5f9f0" stop-opacity="0.6" />
                        </radialGradient>
                        <filter id="splashShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
                            <feOffset dx="0" dy="4" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.3"/>
                            </feComponentTransfer>
                            <feMerge>
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="splashGlow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Rounded square -->
                    <rect x="20" y="20" width="60" height="60" rx="12" fill="url(#splashLogoGrad)" filter="url(#splashShadow)"/>
                    <rect x="20" y="20" width="60" height="60" rx="12" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.3"/>
                    <!-- Circular cutout -->
                    <circle cx="50" cy="50" r="20" fill="none"/>
                    <!-- Left half - green -->
                    <path d="M 50 30 A 20 20 0 0 1 50 70 L 50 50 Z" fill="#059669" opacity="0.7"/>
                    <!-- Right half - white -->
                    <path d="M 50 30 A 20 20 0 0 0 50 70 L 50 50 Z" fill="url(#splashWhiteGlow)"/>
                    <!-- Glow at intersection -->
                    <circle cx="50" cy="50" r="10" fill="url(#splashGlowGrad)" opacity="0.6" filter="url(#splashGlow)"/>
                    <!-- Highlight -->
                    <ellipse cx="60" cy="50" rx="8" ry="12" fill="#ffffff" opacity="0.9"/>
                </svg>
            </div>
            <h1 class="app-name">Wapiea</h1>
            <p class="tagline">WhatsApp Marketing Automation</p>
        </div>

        <div class="loading-container">
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <p class="loading-text">Loading Application...</p>
        </div>
    </div>

    <div class="powered-by">
        Powered By <strong>Cripcocode Technologies Pvt Ltd</strong>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-10px';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles
        createParticles();

        // Update loading bar
        let progress = 0;
        const loadingBar = document.querySelector('.loading-bar');
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress > 95) progress = 95;
            loadingBar.style.width = progress + '%';
        }, 200);

        // Redirect after splash screen duration
        setTimeout(() => {
            clearInterval(loadingInterval);
            loadingBar.style.width = '100%';
            loadingBar.style.transition = 'width 0.5s ease-out';
            
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease-out';
                document.body.style.opacity = '0';
                setTimeout(() => {
                    // The main process will handle the redirect
                }, 500);
            }, 500);
        }, 3000);
    </script>
</body>
</html>
